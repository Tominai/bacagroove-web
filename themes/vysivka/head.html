<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Výšivka: valašský lidový tisk na papíře, křížkový steh = pixel (folklor ↔ digitál). Černá tiskařská čerň, krojová červená, modrotisk */
:root{
  --paper:#f2e8d3; --paper-2:#e8dbbf; --ink:#1c1712; --red:#c2322a; --indigo:#26365f; --mute-ink:#5d5245;
  --display:"Alfa Slab One",Rockwell,"Roboto Slab",Georgia,serif;
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink)}
body::after{background:
  radial-gradient(circle at 20% 30%,rgba(120,90,40,.08),transparent 40%),
  radial-gradient(circle at 80% 70%,rgba(120,90,40,.07),transparent 45%)}
.stitch{display:block;width:100%;height:44px;margin-inline:auto}
.stitch-wrap{padding-top:18px}
.top img{filter:invert(1)}
.lang{border-color:var(--ink)}
.lang button{color:var(--mute-ink)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
a:focus-visible,button:focus-visible{outline-color:var(--red)}

.portrait{background:var(--red);border:3px solid var(--ink);border-radius:6px;box-shadow:10px 10px 0 var(--indigo);overflow:hidden}
.portrait img{border-radius:0;filter:grayscale(1) contrast(1.35) brightness(1.08);mix-blend-mode:multiply}
.portrait figcaption{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:0;backdrop-filter:none;font-weight:700}
h1{font-weight:400;color:var(--ink);font-size:clamp(46px,8vw,80px);line-height:.95;letter-spacing:0}
h1 span{color:var(--red)}
.tag{font-family:var(--body);font-weight:800;text-transform:uppercase;letter-spacing:.2em;font-size:15px;color:var(--indigo)}
.row{background:var(--ink);border:2px solid var(--ink);border-radius:4px;color:var(--paper);box-shadow:5px 5px 0 var(--red)}
.row:hover{background:#2c251d;border-color:var(--ink);transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--red)}
.row-main{background:var(--ink);border-color:var(--ink);box-shadow:6px 6px 0 var(--indigo)}
.play{border-color:var(--paper)}
.row-main .play{background:var(--red);color:var(--paper);border-color:var(--red)}
h2{font-weight:400;color:var(--ink)}
.eyebrow{color:var(--red)}
section,.social{border-top:2px dashed var(--ink)}
.card{background:var(--paper-2);border:2px solid var(--ink);border-radius:4px}
.card:hover{background:#e0d1b1}
.card img{border-radius:0;border:2px solid var(--ink)}
.card h3{font-family:var(--display);font-weight:400;color:var(--ink)}
.go{color:var(--ink)}
.go .tri{color:var(--red)}
.vid .thumb::after{background-color:var(--red)}
.tile img{border-radius:0;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--indigo)}
.tname{color:var(--ink)}
.about p{color:var(--ink)}
.contact .who{color:var(--mute-ink)}
.contact a{border-bottom-color:var(--red)}
.social svg{fill:var(--ink)}
.social a:hover svg{fill:var(--red)}
footer{color:var(--mute-ink)}
@media(prefers-reduced-motion:reduce){.row:hover{transform:none}}
</style>
