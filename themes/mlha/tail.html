<script>
(function(){
  var cv=document.querySelector(".sky"),x=cv.getContext("2d");
  function rng(s){return function(){s=(s*16807)%2147483647;return s/2147483647;};}
  var LAYERS=[["#7a76a8",.40],["#5c5a8c",.47],["#433f72",.55],["#2f2d5a",.63],["#222346",.72],["#171a33",.82]];
  var prof=LAYERS.map(function(_,i){var R=rng(311+i*97),o=[];for(var k=0;k<5;k++)o.push([R()*6.28,1+k*1.7+R(),(R()*.6+.4)/(k+1)]);return o;});
  var stars=(function(){var R=rng(42),a=[];for(var i=0;i<70;i++)a.push([R(),R()*.45,R()*1.1+.3,R()*6.28]);return a;})();
  var still=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){var d=window.devicePixelRatio||1;cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;x.setTransform(d,0,0,d,0,0);}
  function ridge(i,px,w){var p=prof[i],s=0;for(var k=0;k<p.length;k++)s+=Math.sin(px/w*6.28*p[k][1]*.5+p[k][0])*p[k][2];return s;}
  function frame(t){
    var w=cv.clientWidth,h=cv.clientHeight;
    var g=x.createLinearGradient(0,0,0,h*.62);
    g.addColorStop(0,"#1b1c3d");g.addColorStop(.45,"#3a2d5c");g.addColorStop(.8,"#9a5a5e");g.addColorStop(1,"#f2a85b");
    x.fillStyle=g;x.fillRect(0,0,w,h);
    var glow=x.createRadialGradient(w/2,h*.62,0,w/2,h*.62,w*.6);glow.addColorStop(0,"rgba(242,168,91,.45)");glow.addColorStop(1,"rgba(242,168,91,0)");
    x.fillStyle=glow;x.fillRect(0,0,w,h);
    stars.forEach(function(s){var a=still?.7:.45+.35*Math.sin(t/900+s[3]);x.fillStyle="rgba(230,232,255,"+a+")";x.beginPath();x.arc(s[0]*w,s[1]*h,s[2],0,6.28);x.fill();});
    for(var i=0;i<LAYERS.length;i++){
      var base=h*LAYERS[i][1],amp=h*(.05+.012*i);
      x.beginPath();x.moveTo(0,h);
      for(var px=0;px<=w;px+=6)x.lineTo(px,base-ridge(i,px,w)*amp);
      x.lineTo(w,h);x.closePath();x.fillStyle=LAYERS[i][0];x.fill();
      if(i<LAYERS.length-1){
        var drift=still?0:(t/90*(i%2?1:-1))%w;
        var fy=base+amp*.2,fg=x.createLinearGradient(0,fy-30,0,fy+40);
        fg.addColorStop(0,"rgba(215,222,234,0)");fg.addColorStop(.5,"rgba(215,222,234,"+(.10+.02*i)+")");fg.addColorStop(1,"rgba(215,222,234,0)");
        x.fillStyle=fg;
        for(var b=-1;b<2;b++){x.beginPath();x.ellipse(w*.3+drift+b*w,fy,w*.38,34,0,0,6.28);x.ellipse(w*.8+drift+b*w,fy+8,w*.3,28,0,0,6.28);x.fill();}
      }
    }
    var f=x.createLinearGradient(0,h*.8,0,h);f.addColorStop(0,"rgba(23,26,51,0)");f.addColorStop(1,"#171a33");x.fillStyle=f;x.fillRect(0,h*.8,w,h*.2);
  }
  size();frame(0);
  window.addEventListener("resize",function(){size();frame(performance.now());});
  if(!still){var last=0;(function loop(t){if(t-last>50){frame(t);last=t;}requestAnimationFrame(loop);})(0);}
})();
</script>
