<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Mlha: soumrak nad vrstvami Beskyd, Bača jako měsíc nad hřebeny; švestkový soumrak, jantarové světlo, mlha */
:root{
  --dusk:#171a33; --dusk-2:#20244a; --amber:#f2a85b; --mist:#d7deea; --mute-m:#9aa3c0; --ember:#e0703f;
  --display:"Gloock",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
html,body{background:var(--dusk);color:var(--mist)}
body::after{background:none}
.sky{position:absolute;left:0;top:0;width:100%;height:860px;z-index:0;pointer-events:none;display:block}
.wrap{position:relative;z-index:1}
.lang{border-color:rgba(215,222,234,.3);background:rgba(23,26,51,.4)}
.lang button[aria-pressed="true"]{background:var(--amber);color:var(--dusk)}
a:focus-visible,button:focus-visible{outline-color:var(--amber)}

.hero{text-align:center}
@media(min-width:880px){.hero{grid-template-columns:1fr;max-width:620px;margin-inline:auto;gap:30px;padding-block:20px 60px}}
.portrait{width:min(300px,72vw);justify-self:center;border-radius:50%;
  box-shadow:0 0 0 1px rgba(242,168,91,.5),0 0 50px rgba(242,168,91,.35),0 0 160px rgba(242,168,91,.25)}
.portrait img{border-radius:50%;filter:grayscale(1) sepia(.35) contrast(1.1) brightness(1.02)}
.portrait figcaption{display:none}
.ident{align-items:center}
h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,9vw,84px);line-height:.98;letter-spacing:-.01em;color:var(--mist)}
h1 span{color:var(--amber)}
.tag{font-family:var(--body);font-weight:500;font-style:italic;font-size:19px;color:var(--mute-m);letter-spacing:.02em}
.list{width:100%;text-align:left}
.row{background:rgba(23,26,51,.62);border-color:rgba(215,222,234,.18);backdrop-filter:blur(10px)}
.row:hover{background:rgba(32,36,74,.8);border-color:rgba(242,168,91,.6)}
.row-main{border-color:rgba(242,168,91,.7);background:linear-gradient(90deg,rgba(242,168,91,.16),rgba(23,26,51,.62) 65%)}
.row-main .play{background:var(--amber);border-color:var(--amber);color:var(--dusk)}
.play{border-color:rgba(215,222,234,.4)}
h2{font-family:var(--display);font-weight:400;font-size:32px;color:var(--mist)}
.eyebrow{color:var(--amber)}
section,.social{border-top-color:rgba(215,222,234,.14)}
.card{background:var(--dusk-2);border-color:rgba(215,222,234,.12)}
.card:hover{background:#292e5a}
.card h3{font-family:var(--display);font-weight:400;color:var(--mist)}
.go .tri{color:var(--amber)}
.vid .thumb::after{background-color:rgba(23,26,51,.75)}
.tile img{border-radius:50%;box-shadow:0 0 0 1px rgba(215,222,234,.15)}
.tile:hover img{box-shadow:0 0 0 2px var(--amber),0 0 30px rgba(242,168,91,.3)}
.tile{text-align:center}
.tname{color:var(--mist)}
.about p{color:var(--mist)}
.contact .who,footer{color:var(--mute-m)}
.contact a{border-bottom-color:var(--amber)}
.social svg{fill:var(--mute-m)}
.social a:hover svg{fill:var(--amber)}
</style>
