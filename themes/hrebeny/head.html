<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Hřebeny: hřebeny Beskyd jako zvuková vlna na klubovém plakátu; noční ultramarín, korálová a šeříková záře */
:root{
  --deep:#0e0b26; --deep-2:#19143a; --lilac:#b9a7ff; --coral:#ff6a7d; --haze:#d9d3f5; --mute-l:#9890c2;
  --display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--deep);color:var(--haze)}
body::after{background:radial-gradient(ellipse 70% 50% at 50% 0%,#2a1f5e 0%,transparent 70%)}
.ridges{position:absolute;left:0;top:0;width:100%;height:760px;z-index:0;pointer-events:none;display:block}
.wrap{position:relative;z-index:1}
.lang{border-color:#3d356e}
.lang button[aria-pressed="true"]{background:var(--coral);color:var(--deep)}
a:focus-visible,button:focus-visible{outline-color:var(--coral)}

.portrait{border-radius:50%;max-width:440px;width:100%;justify-self:center;overflow:hidden;
  box-shadow:0 0 0 2px var(--coral),0 0 60px rgba(255,106,125,.35),0 0 140px rgba(185,167,255,.25)}
.portrait img{border-radius:50%;filter:grayscale(1) contrast(1.2)}
.portrait::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(160deg,var(--coral),#5b3fd1 70%);mix-blend-mode:color;opacity:.85}
.portrait figcaption{z-index:1;left:50%;transform:translateX(-50%);bottom:22px;background:rgba(14,11,38,.7);color:var(--haze);letter-spacing:.2em}
h1{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(58px,11vw,112px);line-height:.86;letter-spacing:.01em;color:var(--haze)}
h1 span{color:transparent;-webkit-text-stroke:2px var(--coral)}
.tag{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.18em;font-size:18px;color:var(--lilac)}
.row{background:rgba(25,20,58,.72);border-color:#3d356e;backdrop-filter:blur(6px)}
.row:hover{background:rgba(40,32,88,.85);border-color:var(--lilac);box-shadow:0 0 24px rgba(185,167,255,.25)}
.row-main{border-color:var(--coral);background:linear-gradient(90deg,rgba(255,106,125,.18),rgba(25,20,58,.72) 65%)}
.row-main .play{background:var(--coral);border-color:var(--coral);color:var(--deep)}
.play{border-color:#6c62a6}
h2{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:34px;letter-spacing:.02em;color:var(--haze)}
.eyebrow{color:var(--coral)}
section,.social{border-top-color:#2c2558}
.card{background:var(--deep-2);border-color:#2f2860}
.card:hover{background:#221b4d;border-color:var(--lilac)}
.card h3{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:30px;color:var(--haze)}
.go .tri{color:var(--coral)}
.tile img{border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.tile:hover img{box-shadow:0 0 0 2px var(--coral),0 10px 34px rgba(255,106,125,.3)}
.tname{color:var(--haze)}
.about p{color:var(--haze)}
.contact .who,footer{color:var(--mute-l)}
.contact a{border-bottom-color:var(--coral)}
.social svg{fill:var(--mute-l)}
.social a:hover svg{fill:var(--coral)}
</style>
